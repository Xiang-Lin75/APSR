name: Test main model
on:
  push:
    branches: [main]
    paths: ['apsr/**', 'tests/**', 'configs/**', 'scripts/**', '*.py', 'requirements*.txt', 'pyproject.toml', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python evaluation/verify_results.py
